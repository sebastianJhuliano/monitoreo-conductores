name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        working-directory: apps/android
        run: npm ci

      - name: Write env
        working-directory: apps/android
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Prebuild (genera el proyecto nativo)
        working-directory: apps/android
        run: npx expo prebuild --platform android --no-install

      - name: Build APK release
        working-directory: apps/android/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monitoreo-conductores
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk

      - name: Crear release (solo al pushear un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/android/app/build/outputs/apk/release/app-release.apk

# trigger manual desde la pestana Actions (Run workflow) o con un tag v*

